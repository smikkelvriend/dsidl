name: Build DSiDL

# Every push to main builds the app and publishes (or updates) the release
# "v<APP_VERSION>" from the Makefile. Bump APP_VERSION to ship an update; the
# DSi finds it via releases/latest/download/version.txt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - name: Install git
        run: |
          if ! command -v git >/dev/null; then
            (apt-get update && apt-get install -y git) || wf-pacman -Sy --noconfirm git
          fi

      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(sed -n 's/^APP_VERSION[[:space:]]*?=[[:space:]]*//p' Makefile | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build Mbed TLS
        run: sh mbedtls-port/build-mbedtls.sh

      - name: Build DSiDL
        run: |
          make APP_VERSION="${{ steps.ver.outputs.version }}"
          echo "${{ steps.ver.outputs.version }}" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dsidl-${{ steps.ver.outputs.version }}
          path: |
            dsidl.nds
            version.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DSiDL ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            dsidl.nds
            version.txt
