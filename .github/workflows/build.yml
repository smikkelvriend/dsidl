name: Build DSiDL

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: skylyrac/blocksds:slim-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install git
        run: |
          if ! command -v git >/dev/null; then
            (apt-get update && apt-get install -y git) || wf-pacman -Sy --noconfirm git
          fi

      - name: Build Mbed TLS
        run: sh mbedtls-port/build-mbedtls.sh

      - name: Build DSiDL
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION=1.0.0 ;; esac
          make APP_VERSION="$VERSION"
          echo "$VERSION" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dsidl
          path: |
            dsidl.nds
            version.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dsidl.nds
            version.txt
